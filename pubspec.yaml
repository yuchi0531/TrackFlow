name: trackflow
description: "TrackFlow - ヤマト運輸・佐川急便・日本郵便 統合荷物追跡アプリ"
publish_to: 'none'
version: 0.0.6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP & HTML Scraping
  http: ^1.3.0
  html: ^0.15.5

  # Database
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1

  # Background Tasks
  workmanager: ^0.9.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Settings Persistence
  shared_preferences: ^2.5.0

  # Permissions (通知権限・アプリ設定画面を開く)
  permission_handler: ^11.3.1

  # Date / Time
  intl: ^0.19.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # File (CSVエクスポート/インポートの保存・選択ダイアログ)
  # 12.0.0-beta.7 を使用:
  #  - 安定版(11.x)の Android build.gradle は AGP 9 で KGP を適用せず
  #    Built-in Kotlin に依存するが、本アプリ(gradle.properties)は
  #    android.builtInKotlin=false(legacy) のため Kotlin がコンパイルされず
  #    ビルド失敗する。12.0.0-beta はプロパティを確認して KGP を適用する。
  #  - win32 ^6 対応のため share_plus 13.x(win32 ^6) とも競合しない。
  #  12安定版リリース後は自動で移行される。
  file_picker: ^12.0.0-beta.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation (Drift ORM)
  build_runner: ^2.4.14
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true
